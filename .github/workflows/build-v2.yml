name: Build v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Rust / host tiers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS deferred to final validation (owner 2026-10-23); see TASKS MAC1.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/build-v2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: false
      - name: Prepare original Python context and frozen controller identity
        run: |
          uv sync --frozen --managed-python
          source_digest=$(uv run python -c 'from atelier.paths import REPO; from atelier.build_v2.controller_client import capture_controller; print(capture_controller(REPO).digest)')
          printf 'ATELIER_CONTROLLER_SOURCE_SHA256=%s\n' "$source_digest" >> "$GITHUB_ENV"
      - name: Install pinned nextest binary
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Check formatting
        run: cargo fmt --check
      - name: Compile interfaces and fixtures
        run: |
          cargo build --locked --bin atelier-build-v2 -j 3
          cargo test --locked --no-run -j 3
      - name: Collect every test and derive the tier plans
        run: |
          cargo nextest list --locked --profile ci --message-format json > ../../build/build-v2/test-list.json
          python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --plan-dir ../../build/build-v2/tiers
      - name: Check both tier filters collect only their own tests
        run: |
          cargo nextest list --locked --profile ci --filter-expr "$(cat ../../build/build-v2/tiers/t0.filter)" --message-format json > ../../build/build-v2/t0-list.json
          cargo nextest list --locked --profile t1a --filter-expr "$(cat ../../build/build-v2/tiers/t1a.filter)" --message-format json > ../../build/build-v2/t1a-list.json
          python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --tier-listing t0=../../build/build-v2/t0-list.json --tier-listing t1a=../../build/build-v2/t1a-list.json
      - name: Run T0 within ten seconds after compilation
        run: cargo nextest run --locked --profile ci --filter-expr "$(cat ../../build/build-v2/tiers/t0.filter)" --no-tests=fail
      - name: Run T1a within thirty seconds after compilation
        run: cargo nextest run --locked --profile t1a --filter-expr "$(cat ../../build/build-v2/tiers/t1a.filter)" --no-tests=fail
      - name: Verify both tier results and the combined roster
        run: python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --result t0=../../build/build-v2/nextest/ci/junit.xml --result t1a=../../build/build-v2/nextest/t1a/junit.xml
      - name: Keep collection and result evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: build-v2-tiers-${{ matrix.os }}
          path: |
            build/build-v2/test-list.json
            build/build-v2/t0-list.json
            build/build-v2/t1a-list.json
            build/build-v2/tiers/
            build/build-v2/nextest/ci/junit.xml
            build/build-v2/nextest/t1a/junit.xml
          retention-days: 7
