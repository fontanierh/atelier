name: Build v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Rust / host tiers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS deferred to final validation (owner 2026-10-23); see TASKS MAC1.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/build-v2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: false
      - name: Prepare original Python context and frozen controller identity
        run: |
          uv sync --frozen --managed-python
          source_digest=$(uv run python -c 'from atelier.paths import REPO; from atelier.build_v2.controller_client import capture_controller; print(capture_controller(REPO).digest)')
          printf 'ATELIER_CONTROLLER_SOURCE_SHA256=%s\n' "$source_digest" >> "$GITHUB_ENV"
      - name: Install pinned nextest binary
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Check formatting
        run: cargo fmt --check
      - name: Compile interfaces and fixtures
        run: |
          cargo build --locked --bin atelier-build-v2 -j 3
          cargo test --locked --no-run -j 3
      - name: Collect every test and derive the tier plans
        run: |
          cargo nextest list --locked --profile ci --message-format json > ../../build/build-v2/test-list.json
          python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --plan-dir ../../build/build-v2/tiers
      - name: Check both tier filters collect only their own tests
        run: |
          cargo nextest list --locked --profile ci --filter-expr "$(cat ../../build/build-v2/tiers/t0.filter)" --message-format json > ../../build/build-v2/t0-list.json
          cargo nextest list --locked --profile t1a --filter-expr "$(cat ../../build/build-v2/tiers/t1a.filter)" --message-format json > ../../build/build-v2/t1a-list.json
          python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --tier-listing t0=../../build/build-v2/t0-list.json --tier-listing t1a=../../build/build-v2/t1a-list.json
      - name: Run T0 within ten seconds after compilation
        run: cargo nextest run --locked --profile ci --filter-expr "$(cat ../../build/build-v2/tiers/t0.filter)" --no-tests=fail
      - name: Run T1a within thirty seconds after compilation
        run: cargo nextest run --locked --profile t1a --filter-expr "$(cat ../../build/build-v2/tiers/t1a.filter)" --no-tests=fail
      - name: Verify both tier results and the combined roster
        run: python3 tools/check_registry.py --registry-dir tests/registry --listing ../../build/build-v2/test-list.json --result t0=../../build/build-v2/nextest/ci/junit.xml --result t1a=../../build/build-v2/nextest/t1a/junit.xml
      - name: Real managed entry integration (readonly Graph then Held)
        id: real_entry_integration
        timeout-minutes: 4
        env:
          ATELIER_LEGACY_INTEGRATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ../../.venv/bin/python ../../games/yorimichi/tests/legacy_host_entry_case.py ../../build/build-v2/debug/atelier-build-v2
      - name: Bind and require the real integration result
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_STEP_OUTCOME: ${{ steps.real_entry_integration.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('../../build/build-v2/legacy-host-entry-test')
          folder.mkdir(parents=True, exist_ok=True)
          expected = {'version': 1, 'case': 'normal_managed_entry_readonly_graph_held',
                      'head': os.environ['EXPECTED_HEAD'], 'run_id': os.environ['GITHUB_RUN_ID'],
                      'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job': os.environ['GITHUB_JOB'],
                      'step_id': 'real_entry_integration'}
          outcome = os.environ['INTEGRATION_STEP_OUTCOME']
          valid = False
          try:
              result_bytes = (folder / 'integration-result.json').read_bytes()
              if len(result_bytes) > 4096:
                  raise ValueError('integration result exceeds its fixed metadata bound')
              record = json.loads(result_bytes)
              if not isinstance(record, dict):
                  raise ValueError('integration result is not a record')
              binary = Path('../../build/build-v2/debug/atelier-build-v2')
              valid = (outcome == 'success' and all(record.get(k) == v for k, v in expected.items())
                       and type(record.get('integration_count')) is int and record['integration_count'] == 1
                       and record.get('verdict') == 'readonly_graph_held'
                       and record.get('target_complete') is False
                       and type(record.get('normal_cli_returncode')) is int
                       and record['normal_cli_returncode'] != 0
                       and bool(os.environ.get('ATELIER_CONTROLLER_SOURCE_SHA256'))
                       and record.get('source') == os.environ['ATELIER_CONTROLLER_SOURCE_SHA256']
                       and record.get('binary') == hashlib.sha256(binary.read_bytes()).hexdigest())
          except (OSError, ValueError, TypeError):
              pass
          binding = {**expected, 'step_outcome': outcome, 'verified_integration_count': 1 if valid else 0}
          descriptor = os.open(folder / 'ci-step-binding.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              json.dump(binding, stream, separators=(',', ':'))
              stream.write('\n')
          if not valid:
              raise SystemExit('real integration did not produce its exact-head successful result')
          PY
      - name: Keep collection and result evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: build-v2-tiers-${{ matrix.os }}
          path: |
            build/build-v2/test-list.json
            build/build-v2/t0-list.json
            build/build-v2/t1a-list.json
            build/build-v2/tiers/
            build/build-v2/nextest/ci/junit.xml
            build/build-v2/nextest/t1a/junit.xml
          retention-days: 7
      - name: Keep separate real integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: build-v2-real-entry-${{ matrix.os }}
          path: build/build-v2/legacy-host-entry-test/
          if-no-files-found: error
          retention-days: 7
