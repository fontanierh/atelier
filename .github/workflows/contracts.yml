name: Code contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Code contracts / syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: npm ci --ignore-scripts --prefix platform/studio/contracts
      - name: Check syntax and ownership
        env:
          PYTHONPATH: platform/studio
        run: python3 -m atelier.contracts check
