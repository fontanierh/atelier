# Clip roles: names are the animation API. Platform code asks for clips by role; a character supplies them.
# loop: the clip repeats. root_motion: the root bone carries travel (otherwise the controller or board moves).
# A game may add roles of its own; it may not redefine these. Skate roles also exist with a Goofy suffix.

