[package]
name = "atelier-board-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "The agent board's web server: the board's HTTP API and pages over the shared SQLite mailbox. `atelier board serve` builds and runs it."

[[bin]]
name = "atelier-board-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
base64 = "0.22"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
markdown-it = "0.6"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = "1"

[profile.release]
opt-level = 3
lto = "thin"
