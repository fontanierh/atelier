[package]
name = "board-world"
version = "0.1.0"
edition = "2024"
publish = false
description = "The agent board as a living world: Bevy compiled to wasm, served by `atelier board serve` at /world."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only what the scene draws: 3D meshes, PBR lighting, fog and WebGL2. No audio, glTF, UI, text or gamepads, so the
# wasm stays small and starts fast; text lives in the page's HTML.
bevy = {version = "=0.18.1", default-features = false, features = [
    "std", "default_app", "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light",
    "bevy_camera", "bevy_mesh", "bevy_color", "bevy_image", "bevy_shader", "webgl2", "tonemapping_luts", "ktx2",
    "zstd_rust", "web",
]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
# Must match the wasm-bindgen CLI that generates the JS glue (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
