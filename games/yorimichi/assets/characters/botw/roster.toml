# The BOTW characters Yorimichi imports from the local asset library (README.md).
#
# id       the library entry (library/<kind>/<id>/asset.json in the extracted library)
# name     the Unreal asset name: /Game/Botw/<name>/SK_<name> and its A_<name>_<Clip> sequences
# clips    "all", or clip names; "re:<pattern>" adds every clip whose name matches
# shares   import the mesh only, on another roster character's skeleton, and use its clips (colour variants)
# roles    what the game's creature actor plays for each behaviour (BotwCreature.h); the export measures the walk and
#          run speeds from the planted ankles, since the clips move in place
# scale    its size in the game relative to the source (a variant takes its owner's): the heights, speeds and
#          capsules are of the scaled character
# skate    the character's bone for each humanoid contract role (platform/conventions, ISkateRider::GetSkateBone; ""
#          for a role it lacks): makes it a rider (-rider=<name>) that the skateboard retargets onto
# board    a rider's skateboard size relative to the standard one (ISkateRider::GetSkateBoardScale; default 1)

# The library's characters are drawn about 15% larger than Yorimichi's (its Zelda stands 1.86 m, Cairo 1.48 m): every
# character takes this scale unless it sets its own, so they keep their sizes relative to each other.
scale = 0.8

[[character]]
id = "Enemy_Bokoblin_Guard_Junior"
name = "Bokoblin"
clips = "all"
roles = { idle = "Wait", walk = "Walk", run = "Run", notice = "Find", angry = "Angry", battle = "Wait_Battle", attack = "Attack_Small", hit = "Damage_Small", down = "Down_Wait", getup = "Down_Getup", dance = "Dance_Loop", sleep = "Sleep_Loop", talk = "Talk_Loop_Stand" }
skate = { root = "Root", pelvis = "Skl_Root", spine = "Spine_1", spine_mid = "", chest = "Spine_2", neck = "Neck", head = "Head", clavicle_L = "Clavicle_L", upperarm_L = "Arm_1_L", forearm_L = "Arm_2_L", hand_L = "Wrist_L", clavicle_R = "Clavicle_R", upperarm_R = "Arm_1_R", forearm_R = "Arm_2_R", hand_R = "Wrist_R", thigh_L = "Leg_1_L", shin_L = "Leg_2_L", foot_L = "Ankle_L", toe_L = "Toe_L", thigh_R = "Leg_1_R", shin_R = "Leg_2_R", foot_R = "Ankle_R", toe_R = "Toe_R" }
# Short legs and big feet: on the standard board its toes hang over the tails; this one puts them over the trucks.
board = 1.6

