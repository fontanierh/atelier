# Nox with the merged adventure move set (adventure/README.md): the reference rig's moves and Cairo's donor clips retargeted onto him
# (adventure/retarget.py --character nox), imported by Scripts/import_adventure_moveset.py (ADVENTURE_CHARACTER=nox).
mesh = "/Game/Nox/SK_Nox"
base = "/Game/Nox/DA_NoxBase"            # from import_nox.py
dest = "/Game/Nox/Adventure"
definition = "/Game/Nox/DA_Nox"
keep_base_actions = true                       # the base's own gestures stay beside the move set's

# Keep the sword below his hair and clear of the hoodie, including the crouched carry.
[fit.push]
sword = [6.5, 0.0, -17.0]

[fit.tilt]
sword = 3.0

[fit]
mount = 0.45

[fit.yaw]
sword = 15.0

[fit.crouch]
pivot = 0.0
yaw = -25.0
pitch = -25.0
out = 12.0

# The operator's final pose-lab TXT, including exact sampled transforms and unit conversion.
# Only the idle loop uses this stance; walking, running, combat and skating keep their motion.
[stance.Nml_Wait]
choice = "provenance/idle-pose-choice.json"
