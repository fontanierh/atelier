# The hippodrome's horses and riders, imported from the local BOTW asset library (README.md) beside the BOTW roster
# (../botw/roster.toml), whose fields these share; export.py adds two of its own.
#
# parts    horse parts (library entries) merged onto the mesh: the mane and tail, rigged on the horse's own bones
# coat     a coat of the standard horse (library/horses/Horse/coats/coats.json id): its body and foot albedos, and the
#          mane and tail colour that goes with it
#
# A rider's clips are BOTW's own riding clips: its Root sits on the horse's Saddle_Root (the clips are authored that
# way), and each Horse_Move_Gear_<n> is the rider's half of the horse's Move_Gear_<n>, frame for frame.

scale = 0.8

[[character]]
id = "Horse"
name = "Horse"
parts = ["Horse_Mane"]
clips = ["Wait", "Wait_Shake", "Wait_Flehmen", "Wait_Eat", "Move_Gear_0To3", "Move_Gear_1", "Move_Gear_2", "Move_Gear_3",
         "Move_Gear_3_Curve_L", "Move_Gear_3_Curve_R", "Move_Gear_Top", "Move_Gear_Top_Fast", "Move_Gear_Top_Start",
         "Move_Gear_Top_Curve_L", "Move_Gear_Top_Curve_R", "Move_Gear_Top_Curve_L_Fast", "Move_Gear_Top_Curve_R_Fast",
         "Move_Gear_1_Stop_F12", "Courbette_Gear_3", "Stagger_L", "Stagger_R"]
roles = { idle = "Wait", walk = "Move_Gear_1", trot = "Move_Gear_2", canter = "Move_Gear_3", run = "Move_Gear_Top", sprint = "Move_Gear_Top_Fast", start = "Move_Gear_0To3", left = "Move_Gear_Top_Curve_L", right = "Move_Gear_Top_Curve_R", stop = "Move_Gear_1_Stop_F12", rear = "Courbette_Gear_3", dance = "Wait_Shake" }

