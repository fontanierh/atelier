# Yorimichi, a painterly Japanese island. The one file that describes this game to Atelier.
id = "yorimichi"
title = "Yorimichi"
atelier = "0.1"
unreal_project = "unreal/Yorimichi.uproject"
editor_target = "YorimichiEditor"
player = "assets/characters/cairo"
build = "build.py"                      # the build recipe: `atelier build yorimichi --list`

[fetch]
# Non-redistributable downloads stay in the ignored Atelier cache. The optional community park needs authenticated gh.
scripts = ["assets/audio/footsteps/fetch.py", "assets/audio/combat/fetch.py", "assets/communitypark/fetch.py",
           "assets/skatepark/fetch.py"]
needs = ["sonniss/footsteps", "sonniss/combat"]

[play.play]
# The default: measured desktop tuning at native 1440 in a window; saved renderer/tree choices are honored.
script = "tools/desktop_preview.py"
args = ["--shared-settings", "--windowed", "--memory-gib={memory_gib}"]

[play.fullscreen]
# The same preferences and desktop tuning, fullscreen at native 1440.
script = "tools/desktop_preview.py"
args = ["--shared-settings", "--memory-gib={memory_gib}"]

[play.desktop]
# The measured desktop profile: forward renderer, 1440 pixels high, city tiles and tree LODs.
script = "tools/desktop_preview.py"
args = ["--shared-settings", "--windowed", "--memory-gib={memory_gib}"]

[play.megapark]
# Faithful source park, in its own native level. The island remains the default.
args = ["/Game/MegaPark/Maps/SuperUltraMegaPark", "-game", "-windowed", "-resx=1920", "-resy=1080", "-ExecCmds=r.RHISetGPUCaptureOptions 0"]

[play.megapark-fullscreen]
args = ["/Game/MegaPark/Maps/SuperUltraMegaPark", "-game", "-fullscreen", "-ForceRes", "-resx=2560", "-resy=1440", "-ExecCmds=r.RHISetGPUCaptureOptions 0"]

[play.desktop-1440]
script = "tools/desktop_preview.py"
args = ["--shared-settings", "--memory-gib={memory_gib}"]

[stream]
# `atelier stream yorimichi start`: the phone page (touch controls, map, settings) at /, the platform's plain player
# (keyboard, mouse or controller on the far device) at /play/. Messages use the "yorimichi" protocol key.
protocol = "yorimichi"
touch_page = "phone"
routes = { map = "map" }                # /map serves build/yorimichi/map (the painted sheet the phone map shows)
video = { width = 1280, height = 720, fps = 60 }
