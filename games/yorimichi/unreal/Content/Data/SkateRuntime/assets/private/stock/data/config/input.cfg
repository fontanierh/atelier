// ==========================================================================
//
// XBOX control scheme 1
//
// ==========================================================================

DPadU = Button0;
DPadD = Button1;
DPadL = Button2;
DPadR = Button3;
Start = Button4;
Back = Button5;
LStick = Button6;
RStick = Button7;
LBumper = Button8;
RBumper = Button9;
LTrigger = Button10;
RTrigger = Button11;
A = Button12;
B = Button13;
X = Button14;
Y = Button15;
LStickR = Button16;
LStickL = Button17;
LStickU = Button18;
LStickD = Button19;
RStickR = Button20;
RStickL = Button21;
RStickU = Button22;
RStickD = Button23;

// ==========================================================================
//
// Key Definitions
//
// ==========================================================================
		

// Menu key definitions, must match menu.h

MenuKeyUp = 0;
MenuKeyDown = 1;
MenuKeyLeft = 2;
MenuKeyRight = 3;
MenuKeyLeftShift = 4;
MenuKeyRightShift = 5;
MenuKeySelect = 6;
MenuKeyCancel = 7;
MenuKeyBack = 8;
MenuOpt1 = 9;
MenuOpt2 = 10;

MenuKey =	
			Back.released				   ? MenuKeyCancel :
			A.released || Start.released   ? MenuKeySelect :
			B.released				       ? MenuKeyBack :
			DPadU.repeat || LStickU.repeat ? MenuKeyUp :
			DPadD.repeat || LStickD.repeat ? MenuKeyDown :
			DPadL.repeat || LStickL.repeat ? MenuKeyLeft :
			DPadR.repeat || LStickR.repeat ? MenuKeyRight :
			LBumper.repeat				   ? MenuKeyLeftShift :
			RBumper.repeat				   ? MenuKeyRightShift :			
			LTrigger.repeat	    		   ? MenuKeyLeftShift :
			RTrigger.repeat				   ? MenuKeyRightShift : 
			Y.repeat					   ? MenuOpt1 :
			X.repeat				       ? MenuOpt2 : -1;

MenuLeft = MAX(DPadL, LStickL);
MenuRight = MAX(DPadR, LStickR);
MenuUp = MAX(DPadU, LStickU);
MenuDown = MAX(DPadD, LStickD);
MenuLeftShift = LBumper.held;
MenuRightShift = RBumper.held;
MenuLeftShiftPressed = LBumper.pressed;
MenuRightShiftPressed = RBumper.pressed;

MenuLeftPressed = DPadL.pressed || LStickL.pressed;
MenuRightPressed = DPadR.pressed || LStickR.pressed;
MenuUpPressed = DPadU.pressed || LStickU.pressed;
MenuDownPressed = DPadD.pressed || LStickD.pressed;
MenuSelectPressed = A.pressed;
MenuDisplay = Start.pressed;

LeftAnalogStickLR = LStickR - LStickL;
LeftAnalogStickUD = LStickU - LStickD;
RightAnalogStickLR = RStickR - RStickL;
RightAnalogStickUD = RStickU - RStickD;
TopFaceButtonHeld = Y.held;
RightFaceButtonHeld = B.held;
BottomFaceButtonHeld = A.held;
LeftFaceButtonHeld = X.held;
TopFaceButtonPressed = Y.pressed;
RightFaceButtonPressed = B.pressed;
BottomFaceButtonPressed = A.pressed;
LeftFaceButtonPressed = X.pressed;
LeftAnalogShoulder = LTrigger;
RightAnalogShoulder = RTrigger;
TopLeftShoulderHeld = LBumper.held;
TopRightShoulderHeld = RBumper.held;
DPadLPressed = DPadL.pressed;
DPadRPressed = DPadR.pressed;
DPadUPressed = DPadU.pressed;
DPadDPressed = DPadD.pressed;
DPadLR = DPadR - DPadL;
DPadUD = DPadU - DPadD;
LeftAnalogStickButtonPressed = LStick.pressed;
RightAnalogStickButtonPressed = RStick.pressed;
LeftAnalogStickButtonHeld = LStick.held;
RightAnalogStickButtonHeld = RStick.held;

// IsControllerActive
ACTIVE_ANALOG_THRESHOLD = 0.1f;
IsControllerActive = 	DPadU.value + DPadD.value + DPadR.value + DPadL.value
		+ Start.value + Back.value + LBumper.value + RBumper.value
		+ A.value + B.value + X.value + Y.value 
		+ LStick.value + RStick.value
		+ ( (abs(LTrigger.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f )
		+ ( (abs(RTrigger.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f )	
		+ ( (abs(LeftAnalogStickLR.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f )
		+ ( (abs(LeftAnalogStickUD.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f )
		+ ( (abs(RightAnalogStickLR.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f )
		+ ( (abs(RightAnalogStickUD.value) >= ACTIVE_ANALOG_THRESHOLD)  ? 1.0f : 0.0f );
					
					
//Shot Editor
ShotEditorActionButtonPressed = A.pressed;
ShotEditorActionButton = A.held;
ShotEditorShoulder = RTrigger - LTrigger;
ShotEditorTranslateX = LStickR - LStickL;
ShotEditorTranslateY = RTrigger - RBumper;
ShotEditorTranslateZ = LStickU - LStickD;
ShotEditorYaw = RStickR - RStickL;
ShotEditorPitch = RStickU - RStickD;
ShotEditorFOV = DPadU - DPadD;
ShotEditorRoll = DPadR - DPadL;

// session markers
SessionMarkerSet = LBumper.held && DPadD.pressed;
SessionMarkerUse = LBumper.held && DPadU.held;

//Manual Camera
ManualCamCommit = X.pressed;
ManualCamZoom = DPadR - DPadL;
ManualCamSpeed = RTrigger;
ManualCamTelport = B.pressed;
ManualCamPosInfo = Y.pressed;

//Debug
DebugPrev = DPadL.pressed;
DebugNext = DPadR.pressed;
DebugPause = Start.pressed;
DebugReplaceSkateboard = DPadU.pressed;
DebugResetWorld = Back.pressed;
DebugScreenShot = LStick.pressed;

//Profile
ProfileStepIn = DPadR.pressed;
ProfileStepOut = DPadL.pressed;
ProfileNextChild = DPadD.pressed;
ProfilePrevChild = DPadU.pressed;
ProfileToggle = DPadL.pressed && RBumper.held;
ProfileRenderToggle = DPadR.pressed && RBumper.held;

//Spectator
SpectatorNext = RTrigger.pressed;
SpectatorPrev = LTrigger.pressed;
SpectatorFree = X.pressed;

// ==========================================================================
//
// Gameplay Definitions
//
// ==========================================================================

GP_LStickX = LStickR - LStickL;
GP_LStickY = LStickU - LStickD;
GP_LStickIn = LStick;

GP_RStickX = RStickR - RStickL;
GP_RStickY = RStickU - RStickD;
GP_RStickIn = RStick;

GP_LTrigger = LTrigger;
GP_RTrigger = RTrigger;

GP_LBumper = LBumper;
GP_RBumper = RBumper;

GP_UDPad = DPadU;
GP_DDPad = DPadD;
GP_LDPad = DPadL;
GP_RDPad = DPadR;

GP_XFace = X;
GP_YFace = Y;
GP_AFace = A;
GP_BFace = B;

// for six axis interoperability
GP_LStickRawX = 0.0f;
GP_LStickRawY = 0.0f;
GP_SensorZ = 0.0f;
GP_SensorX = 0.0f;
        
// ==========================================================================

// Manual Replay definitions
ManualReplayForwardFrame = RTrigger;
ManualReplayReverseFrame = LTrigger;
ManualReplayForwardSingleFrame = RBumper.pressed;
ManualReplayReverseSingleFrame = LBumper.pressed;
ManualReplayNextCam = DPadR.pressed;
ManualReplayPrevCam = DPadL.pressed;
ManualReplayPlay = A.pressed;
ManualReplayStop = A.pressed;
ManualRStickX = RStickR - RStickL;
ManualLStickX = LStickR - LStickL;
ManualRStickY = RStickU - RStickD;
ManualLStickY = LStickU - LStickD;

//Trigger Volume
TriggerVolumeIncrementGroup = RBumper.pressed;
TriggerVolumeDecrementGroup = LBumper.pressed;

//ICE
ICEEditorOn					= (RTrigger && Back.pressed);
IceActionSouth				= A.held;
IceActionSouthPress			= A.pressed;
IceActionNorth				= Y.held;
IceActionNorthPress			= Y.pressed;
IceActionEast				= B.held;
IceActionEastPress			= B.pressed;
IceActionWest				= X.held;
IceActionWestPress			= X.pressed;
IceActionDown				= DPadD;
IceActionDownPress			= DPadD.pressed;
IceActionUp					= DPadU;
IceActionUpPress			= DPadU.pressed;
IceActionLeft				= DPadL;
IceActionLeftPress			= DPadL.pressed;
IceActionRight				= DPadR;
IceActionRightPress			= DPadR.pressed;
IceActionL1					= LTrigger;
IceActionL1Press			= LTrigger.pressed;
IceActionL2					= LBumper;
IceActionL2Press			= LBumper.pressed;
IceActionL3					= LStick;
IceActionL3Press			= LStick.pressed;
IceActionR1					= RTrigger;
IceActionR1Press			= RTrigger.pressed;
IceActionR2					= RBumper;
IceActionR2Press			= RBumper.pressed;
IceActionR3					= RStick;
IceActionR3Release			= RStick.released;
IceActionLeftStickLeft		= LStickL;
IceActionLeftStickRight		= LStickR;
IceActionLeftStickUp		= LStickU;
IceActionLeftStickDown		= LStickD;
IceActionRightStickLeft		= RStickL;
IceActionRightStickRight	= RStickR;
IceActionRightStickUp		= RStickU;
IceActionRightStickDown		= RStickD;

//Apt
AptStart = Start.pressed;
AptSelect = Back.pressed;
AptNext = A.pressed;
AptPrevious = B.pressed;
AptOption = Y.pressed;
AptMisc = X.pressed;
AptRShift1 = RBumper.pressed;
AptRShift2 = RTrigger.pressed;
AptRShift3 = RStick.pressed;
AptLShift1 = LBumper.pressed;
AptLShift2 = LTrigger.pressed;
AptLShift3 = LStick.pressed;
AptUp = LStickU.repeat || DPadU.repeat;
AptDown = LStickD.repeat || DPadD.repeat;
AptLeft = LStickL.repeat || DPadL.repeat;
AptRight = LStickR.repeat || DPadR.repeat;
AptLStickUp = LStickU.repeat;
AptLStickDown = LStickD.repeat;
AptLStickLeft = LStickL.repeat;
AptLStickRight = LStickR.repeat;
AptRStickUp = RStickU.repeat;
AptRStickDown = RStickD.repeat;
AptRStickLeft = RStickL.repeat;
AptRStickRight = RStickR.repeat;
AptDUp = DPadU.repeat;
AptDDown = DPadD.repeat;
AptDLeft = DPadL.repeat;
AptDRight = DPadR.repeat;
AptUpReleased = LStickU.released || DPadU.released;
AptDownReleased = LStickD.released || DPadD.released;
AptLeftReleased = LStickL.released || DPadL.released;
AptRightReleased = LStickR.released || DPadR.released;
AptLStickUReleased = LStickU.released;
AptLStickDReleased = LStickD.released;
AptLStickLReleased = LStickL.released;
AptLStickRReleased = LStickR.released;
AptRStickUReleased = RStickU.released;
AptRStickDReleased = RStickD.released;
AptRStickLReleased = RStickL.released;
AptRStickRReleased = RStickR.released;
AptDUpReleased = DPadU.released;
AptDDownReleased = DPadD.released;
AptDLeftReleased = DPadL.released;
AptDRightReleased = DPadR.released;
AptStartReleased = Start.released;
AptSelectReleased = Back.released;
AptNextReleased = A.released;
AptPreviousReleased = B.released;
AptOptionReleased = Y.released;
AptMiscReleased = X.released;
AptRShift1Released = RBumper.released;
AptRShift2Released = RTrigger.released;
AptRShift3Released = RStick.released;
AptLShift1Released = LBumper.released;
AptLShift2Released = LTrigger.released;
AptLShift3Released = LStick.released;
AptRStickX = RStickR - RStickL;
AptRStickY = RStickU - RStickD;
AptZoomL = LBumper;
AptZoomR = RBumper;

StartSignupChallenge = DPadU.pressed && !LBumper.held && !RBumper.held;

// ==========================================================================
//
// Object Dropper 
//
// ==========================================================================

// FreeCam //

GodHand_Cursor_MoveLeft = LStickL * LStickL * LStickL;
GodHand_Cursor_MoveRight = LStickR * LStickR * LStickR;
GodHand_Cursor_MoveForward = LStickU * LStickU * LStickU;
GodHand_Cursor_MoveBack = LStickD * LStickD * LStickD;
GodHand_Cursor_ElevateUp = DPadU.held;
GodHand_Cursor_ElevateDown = DPadD.held;

GodHand_Cursor_Simple_MoveLeft = LStickL.repeat;
GodHand_Cursor_Simple_MoveRight = LStickR.repeat;
GodHand_Cursor_Simple_MoveForward = LStickU.repeat;
GodHand_Cursor_Simple_MoveBack = LStickD.repeat;
GodHand_Cursor_Simple_ElevateUp = DPadU.repeat;
GodHand_Cursor_Simple_ElevateDown = DPadD.repeat;

GodHand_Camera_RotateLeft = RStickL * RStickL * RStickL;
GodHand_Camera_RotateRight = RStickR * RStickR * RStickR;
GodHand_Camera_RotateUp = RStickU * RStickU * RStickU;
GodHand_Camera_RotateDown = RStickD * RStickD * RStickD;

GodHand_Camera_ZoomIn = DPadR.held;
GodHand_Camera_ZoomOut = DPadL.held;

GodHand_Rotate_Left = LStickL * LStickL * LStickL;
GodHand_Rotate_Right = LStickR * LStickR * LStickR;
GodHand_Rotate_Up = LStickU * LStickU * LStickU;
GodHand_Rotate_Down = LStickD * LStickD * LStickD;
GodHand_SimpleRotate_Left = LStickL.repeat;
GodHand_SimpleRotate_Right = LStickR.repeat;
GodHand_SimpleRotate_Up = LStickU.repeat;
GodHand_SimpleRotate_Down = LStickD.repeat;
GodHand_AdvancedModifier = LTrigger.held;

