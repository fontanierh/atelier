[/Script/AtelierSkate.SkateSettings]
MotionData=/Game/SkateMotion/MotionData.MotionData
RuntimeData=/Game/SkateRuntime/RuntimeData.RuntimeData
PopHeightScale=1.15
AirSpinScale=1.6
PushSpeedScale=1.15
PushPowerScale=1.45
VertAssist=1
; Powerslides drift: straight down slides too, from half tilt, gripping (and slowing) as far as the stick is pulled,
; and let go the board comes back round under the rider, keeping the speed and the line. The player can turn it off in
; the Skate feel menu. DriftGrip and DriftFullGrip are its wheel friction at half and full tilt.
bDriftPowerslide=True
; Grinds take twice the knocks and twist before a bail, and a stalled rail slide drops off instead of wiping out; a
; slam onto the rail or sideways into it takes half as much more and still bails. Grind balance in the Skate feel menu.
GrindTolerance=2
; The camera keeps up with the rider up to 80 m/s, twice the authored 40: Crater Park's big lines run at 130-170 km/h,
; where the stock limit let the rider pull away from the camera and the gap jitter.
CameraFollow=2
; ...and drops back a bounded way at speed: from 25 m/s it eases out to 1.8 times its distance at 45 m/s and holds
; there (about 5 m behind at 170 km/h, against 2.8 m with no pull-back and an ever-growing gap at stock). The player's
; Skate menu default.
CameraPullback=0.8
; An air off a curved vert wall turns with the wall instead of flying straight on along its tangent: off the Vert drop's
; U-turn (95 m to its lip) a 40 m/s rider otherwise lands 8 m behind the lip after 1 s of air, ~30 m after 2 s. Only
; vert-aligned airs with vert assist and no transfer turn, so a zero-assist kicker and a transfer still fly straight.
WallFollow=1
; Hardflips and inward heelflips also read from a flick close to straight down then up (skate. style), beside the wide
; authored arc. The player can turn it off in the Skate feel menu.
bTightFlicks=True
; Skateboarding (platform/engine/Plugins/Activities/Skate): the pier's board (Scripts/import_skatepark.py), the board
; sounds (Scripts/import_skate_audio.py) and the combat bank's body falls for bails.
DeckMesh=/Game/SkatePark/Board/SM_SkateDeck.SM_SkateDeck
TruckMesh=/Game/SkatePark/Board/SM_SkateTruck.SM_SkateTruck
WheelMesh=/Game/SkatePark/Board/SM_SkateWheel.SM_SkateWheel
; Ride's board dissolve (Scripts/board_dissolve_material.py).
BoardDissolveMaterial=/Game/SkatePark/Board/M_BoardDissolve.M_BoardDissolve
SoundFolder=/Game/Audio/Skate
+FallSounds=/Game/Audio/Combat/body_fall_01.body_fall_01
+FallSounds=/Game/Audio/Combat/body_fall_02.body_fall_02
; What the ground rides like (SkateSettings.h, docs/SKATE.md): grass barely rolls, dirt and sand drag, asphalt and stone
; rumble and keep their speed, concrete, wood and metal are smooth. M_Village is one vertex-colour material shared by the
; mini-mega, its trail and the hamlet, so those go by mesh. Hidamari's
; city material gives each face a slot MI_HD_<slug> (world/regions/hidamari/surfaces.py). Its sidewalk, concrete and
; paint, and anything else unlisted (the parks' M_Collision), are concrete.
SurfaceMeshes=(("Mega_Ramp",Wood),("ZP_MegaPark",Wood),("ZP_Gangway",Wood),("Mega_Trail",Dirt),("HD_NorthParkTrail",Dirt),("ZP_Trail",Dirt))
SurfaceMaterials=(("Ground",Grass),("Hills",Grass),("Grass",Grass),("Moss",Grass),("FarForest",Grass),("Flower",Grass),("NorthMountains",Grass),("TH_moss",Grass),("NorthGate",Dirt),("Lane",Dirt),("Dirt",Dirt),("Mud",Dirt),("Litter",Dirt),("Sand",Sand),("Road",Asphalt),("Paint",Asphalt),("Stone",Stone),("Rock",Stone),("Tile",Stone),("Plaster",Stone),("RoofTile",Stone),("TH_stone",Stone),("TH_tile",Stone),("Pier_basalt",Stone),("Pier_ceramic",Stone),("Concrete",Concrete),("Pier_concrete",Concrete),("Pier_painted",Concrete),("Pier_mural",Concrete),("Metal",Metal),("Pier_steel",Metal),("Wood",Wood),("Lattice",Wood),("Bark",Wood),("Vermilion",Wood),("Pier_wood",Wood),("TH_wood_plank",Wood),("TH_wood_timber",Wood),("TH_wood_pale",Wood),("TH_hull",Wood),("TH_shingle",Wood),("HD_grass",Grass),("HD_moss",Grass),("HD_rice",Grass),("HD_earth",Dirt),("HD_gravel",Dirt),("HD_asphalt",Asphalt),("HD_flagstone",Stone),("HD_stone",Stone),("HD_drystone",Stone),("HD_brick",Stone),("HD_roof",Stone),("HD_plaster",Stone),("HD_metal",Metal),("HD_siding",Wood),("HD_timber",Wood))

