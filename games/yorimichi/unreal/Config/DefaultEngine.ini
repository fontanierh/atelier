GlobalDefaultGameMode=/Script/Yorimichi.JapanGameMode

[SystemSettings]
t.MaxFPS=60
r.ScreenPercentage=100
; Blend foliage LODs over 15 frames at 60 fps without carrying both meshes for
; half a second while skating through dense roadside trees.
lod.TemporalLag=0.25
; Half as many screen probes per axis; suits the broad, diffuse painted materials.
r.Lumen.ScreenProbeGather.DownsampleFactor=32
; Larger normal/view offsets moved opposite sides of the inverted character
; into different probe cells, producing hard lighting bands during flips.
; Keep the cheaper irradiance field with the engine's original offset
; (docs/DESKTOP_PERFORMANCE.md, "Settings that matter").
r.Lumen.IrradianceFieldGather.ProbeOcclusionBias=0.8
; Short-range AO ignores occluders floating more than 4% of the pixel's depth in front of it. With the engine's 30%
; the skateboard (9 cm over the ground) left a speckled halo and a ghost copy of itself where it had just been; the
; landscape changes by about 2-4 grey levels inside foliage.
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.ForegroundSampleRejectDistanceFraction=0.04

[/Script/Engine.RendererSettings]
; Preserve accurate foliage motion vectors while avoiding a separate velocity pass.
r.VelocityOutputPass=1
; Keep the player readable through the painterly scene filter.
r.CustomDepth=3
r.DefaultFeature.MotionBlur=False
r.MotionBlurQuality=0
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.GenerateMeshDistanceFields=True
r.ReflectionMethod=0
r.AntiAliasingMethod=2
r.TemporalAACurrentFrameWeight=0.10
r.TemporalAASamples=16
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AmbientOcclusion=True
r.Shadow.DistanceScale=1.5

