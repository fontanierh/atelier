[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = "0.20.0"
hakuba_world = { path = "crates/world" }

[package]
name = "hakuba"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_world.workspace = true

# Hakuba stays quick to compile; Bevy and other dependencies are optimized once so the game runs fast in development.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
