# The Rust workspace: the game program (src/main.rs), its feature crates (crates/*) and the asset exporter
# (tools/export), with the dependency versions they share.
[workspace]
members = ["crates/*", "tools/export"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = "0.20.0"
hakuba_audio = { path = "crates/audio" }
hakuba_characters = { path = "crates/characters" }
hakuba_glider = { path = "crates/glider" }
hakuba_menu = { path = "crates/menu" }
hakuba_player = { path = "crates/player" }
hakuba_rendering = { path = "crates/rendering" }
hakuba_screens = { path = "crates/screens" }
hakuba_settings = { path = "crates/settings" }
hakuba_viewer = { path = "crates/viewer" }
hakuba_world = { path = "crates/world" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[package]
name = "hakuba"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# In the browser the game draws with WebGPU rather than WebGL2: WebGL2 rebinds every texture of a material on every
# draw, which cost two thirds of each frame.
bevy = { workspace = true, features = ["webgpu"] }
hakuba_audio.workspace = true
hakuba_characters.workspace = true
hakuba_glider.workspace = true
hakuba_menu.workspace = true
hakuba_player.workspace = true
hakuba_rendering.workspace = true
hakuba_screens.workspace = true
hakuba_settings.workspace = true
hakuba_viewer.workspace = true
hakuba_world.workspace = true

# Development builds: Hakuba's own code is lightly optimized so it compiles fast; the dependencies are compiled once,
# fully optimized, so the game runs fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.hakuba_rendering]
opt-level = 3
