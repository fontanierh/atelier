# The browser build puts assets/ next to the game, without what only the exports use: src/ folders, asset.toml and the
# world's tile checksums. The files are hard links to assets/, so a build writes almost nothing however large they are.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["export", "--check", "assets"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "rsync -a --link-dest=\"$PWD/assets/\" --exclude=src/ --exclude=asset.toml --exclude=checksums.toml assets/ \"$TRUNK_STAGING_DIR/assets/\""]
