<!doctype html>
<!-- The page the browser build runs in (trunk serve / trunk build): it loads the game and gives it the canvas. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hakuba</title>
    <link data-trunk rel="rust" data-bin="hakuba">
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="hakuba"></canvas>
  </body>
</html>
