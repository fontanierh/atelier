<!doctype html>
<!-- The page the browser build runs in (trunk serve / trunk build): it loads the game and gives it the canvas. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hakuba</title>
    <link data-trunk rel="rust" data-bin="hakuba">
    <script>
      // Browsers keep a page's sound off until a click or a key: the game opens its audio before then, so on the first
      // one, every audio context the page has made is started.
      (function () {
        const contexts = [];
        for (const name of ["AudioContext", "webkitAudioContext"]) {
          const Original = window[name];
          if (!Original) continue;
          window[name] = new Proxy(Original, {
            construct(target, args) {
              const context = Reflect.construct(target, args);
              contexts.push(context);
              return context;
            },
          });
        }
        const resume = () => {
          for (const context of contexts) if (context.state !== "running") context.resume();
        };
        for (const event of ["pointerdown", "keydown", "touchstart"]) {
          document.addEventListener(event, resume, { capture: true });
        }
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="hakuba"></canvas>
    <script>
      // The game draws with WebGPU: without it, say so rather than show a black page.
      if (!navigator.gpu) {
        document.body.innerHTML =
          '<p style="color:#ddd;font:16px sans-serif;text-align:center;margin-top:40vh">' +
          'Hakuba needs a browser with WebGPU: a recent Chrome, Edge or Safari.</p>';
      }
    </script>
  </body>
</html>
