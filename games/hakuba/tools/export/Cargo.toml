# The `export` command (src/main.rs), which writes each asset folder's .glb (assets/README.md).
[package]
name = "hakuba_export"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "export"
path = "src/main.rs"

[dependencies]
geo = { version = "=0.33.1", default-features = false, features = ["earcut"] }
anyhow = "1.0.98"
hakuba_water_schema.workspace = true
glam = "0.33.12"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ktx2 = "0.5.0"
ruzstd = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
toml_edit = { version = "0.25.15", features = ["serde"] }
vorbis_rs = "0.5.6"
