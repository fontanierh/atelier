# The desktop game's frame pacer and frame log. See README.md.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_pacing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_screens.workspace = true
hakuba_settings.workspace = true

# The vendored Metal backend keeps each frame on screen at least a 60th of a second, and times the GPU's work.
# See vendor/README.md.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu-hal = "30"

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
