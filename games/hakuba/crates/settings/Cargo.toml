# The settings. See README.md.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_settings"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_screens.workspace = true
serde.workspace = true
serde_json.workspace = true

# In the browser the settings are kept in the page's local storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Storage", "Window"] }

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
