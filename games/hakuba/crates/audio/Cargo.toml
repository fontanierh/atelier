# The sounds: the player's footsteps, landings and moves, the paraglider's wind and the countryside. See README.md.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_player.workspace = true
hakuba_skate.workspace = true
hakuba_screens.workspace = true
hakuba_settings.workspace = true
hakuba_world.workspace = true
serde.workspace = true
serde_json.workspace = true

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
