# A DualSense read from its HID reports on macOS, and the playtests' scripted pad. See README.md.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_gamepad"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_screens.workspace = true
hakuba_world.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["macos-shared-device"] }

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
