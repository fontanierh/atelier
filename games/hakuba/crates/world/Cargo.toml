# The world. See README.md.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_world"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
hakuba_characters.workspace = true
hakuba_rendering.workspace = true
hakuba_screens.workspace = true
hakuba_settings.workspace = true
hakuba_water_schema.workspace = true
hakuba_world_skate_schema = { path = "../../schemas/world-skate" }
parry3d = { version = "=0.31.1", default-features = false, features = ["std", "alloc", "dim3", "f32"] }
serde.workspace = true
serde_json.workspace = true

# Simplifies the distant blocks' painted ground on the desktop; its C++ does not build for the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Location", "Window"] }

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
