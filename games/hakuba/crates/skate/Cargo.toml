# Skating simulation and its Bevy host integration.
[package]
# Retired experiment: no automatically discovered test or benchmark targets.
autotests = false
autobenches = false
name = "hakuba_skate"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
bevy.workspace = true
hakuba_skate_schema.workspace = true
hakuba_player.workspace = true
hakuba_characters.workspace = true
hakuba_world.workspace = true
hakuba_screens.workspace = true
hakuba_settings.workspace = true
hakuba_glider.workspace = true
serde.workspace = true
serde_json.workspace = true

# Retired experiment: keep ordinary cargo test from compiling or running this suite.
[lib]
test = false
doctest = false
bench = false
