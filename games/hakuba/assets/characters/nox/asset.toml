# Nox, a playable young adult in a black bomber and violet-patterned shirt, with an earring and rigged hair locks.
# src/model.glb is his finished model: mesh, skeleton, skin weights and full-size textures. src/nox.rs maps his
# skeleton to the rig and holds his changes to the animations. `cargo export` writes nox.glb from them, the file the
# game loads: scaled to his game height, with smaller textures and his animations.
kind = "character"
character = "nox"
source = "src/model.glb"
height_m = 1.78        # the source stands about 1.08 m tall
texture_size = 2048    # the source's 4K textures, halved for the browser download
inputs_sha256 = "8c2cd17f4aa3b9b8ce9a467e18eb4c1736c0fa9acb4f767d98289447f828d997"
