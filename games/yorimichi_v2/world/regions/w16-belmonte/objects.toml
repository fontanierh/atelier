# Belmonte objects a person edits on their own (tools/migrate/objects.py). Each object lists the runtime groups that
# hold it alone (one placement each); `model` is its unit in assets/adopted/belmonte/units.json.
schema = 1
tag = "belmonte"
data = "belmonte/runtime.json"

# Not objects: village houses 1-8 (SM_BM_BVV_Village_1..8) are the source scene's distant hill villages, kilometres
# outside the district; the runtime never draws them (ABelmonteRegion::SceneryTransforms), so nothing is saved.

[[objects]]
id = "object/belmonte/church"
groups = ["SM_BM_BH_Church"]
model = "adopted/belmonte/town-church"
about = "the town church"

