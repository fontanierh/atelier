[TextureStreaming]
; Override BaseMacEngine.ini's PoolSizeVRAMPercentage=70 so Apple Silicon unified memory
; uses a bounded streaming pool and accounts for non-streaming mips instead of 70% of 0.75*RAM.
PoolSizeVRAMPercentage=0

[SystemSettings]
; Keep Cairo's animated hair on the compute skinning path. UE 5.8's inline
; skinning path can read an uninitialized morph-history buffer on Mac.
r.SkinCache.CompileShaders=1
; Default bare packaged YorimichiV2.app to 1440p borderless instead of BaseMacEngine.ini's 1280x720.
r.SetRes=2560x1440wf
; SystemSettings (ECVF_SetBySystemSettingsIni) outranks BaseScalability.ini TextureQuality@3 (ECVF_SetByScalability).
r.Streaming.PoolSize=1536
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.AmortizeCPUToGPUCopy=1

[/Script/MacTargetPlatform.XcodeProjectSettings]
; V2's own app identity: its saved data lives in its own sandbox container, apart from the donor's and its saves
; (docs/PACKAGE.md). The template value com.YourCompany.* is refused by tools/package/cook_config.py. UE 5.8's Xcode
; build reads this section (MacTargetSettings' key is ignored: its package came out com.YourCompany.YorimichiV2).
BundleIdentifier=com.atelier.yorimichiv2
; The sandboxed app's entitlements (Build/Mac/Resources/YorimichiV2.entitlements): the engine's server set plus the
; CoreAudio service lookup without which audio start-up blocks forever in the sandbox (the donor's playtest
; audio_compatibility). Shipping keeps the same set: multiplayer needs the network.
PremadeMacEntitlements=(FilePath="/Game/Build/Mac/Resources/YorimichiV2.entitlements")
ShippingSpecificMacEntitlements=(FilePath="/Game/Build/Mac/Resources/YorimichiV2.entitlements")
