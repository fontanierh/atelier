[SystemSettings]
; Keep Cairo's animated hair on the compute skinning path. UE 5.8's inline
; skinning path can read an uninitialized morph-history buffer on Mac.
r.SkinCache.CompileShaders=1

[/Script/MacTargetPlatform.MacTargetSettings]
; V2's own app identity: its saved data lives in its own sandbox container, apart from the donor's and its saves
; (docs/PACKAGE.md). The template value com.YourCompany.* is refused by tools/package/cook_config.py.
BundleIdentifier=com.atelier.yorimichiv2
