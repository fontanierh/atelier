# Planned from the donor (tools/migrate/small_instances.py): 5 instances of adopted/japan/materials/ground, each agreeing with its editor read.
# The values are the generator's, agreeing with the committed editor read (docs/inventory/small-families-reads/
# instances); the import writes each instance from its row and reads every value back. Never edited by hand.
schema = 1
id = "material/japan/materials/ground-instances"
kind = "material-instance"
authority = "generated"
owner = "shared/japan/materials/ground-instances"
license = "owner-published (docs/DECISIONS.md D05 group 1)"
provenance = "donor build of games/yorimichi at the V2 source baseline (docs/DECISIONS.md D01, D02); pinned by sha256"
input_dependencies = ["adopted/japan/textures/ground", "master/japan/surfaces/foliage", "master/japan/surfaces/painted", "texture/japan/white"]

[recipe]
importer = "material-instance"
version = 2

[recipe.settings]

[[recipe.settings.instances]]
package = "/Game/Japan/Materials/MI_Ground"
parent = "/Game/Japan/Materials/M_Painted"
textures = {Tex = "/Game/Japan/Textures/T_ground"}

[[recipe.settings.instances]]
package = "/Game/Japan/Materials/MI_Litter"
parent = "/Game/Japan/Materials/M_Foliage"
textures = {Tex = "/Game/Japan/Textures/T_litter"}

[[recipe.settings.instances]]
package = "/Game/Japan/Materials/MI_Moss"
parent = "/Game/Japan/Materials/M_Painted"
textures = {Tex = "/Game/Japan/Textures/T_white"}
vectors = {Tint = [0.3, 0.38, 0.16, 1.0]}

[[recipe.settings.instances]]
package = "/Game/Japan/Materials/MI_Road"
parent = "/Game/Japan/Materials/M_Painted"
textures = {Tex = "/Game/Japan/Textures/T_road"}
vectors = {Tint = [0.34, 0.33, 0.33, 1.0]}

[[recipe.settings.instances]]
package = "/Game/Japan/Materials/MI_Sand"
