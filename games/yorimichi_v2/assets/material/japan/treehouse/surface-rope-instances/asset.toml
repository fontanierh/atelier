# Planned from the donor (tools/migrate/small_instances.py): 1 instances of adopted/japan/treehouse/surface-rope, each agreeing with its editor read.
# The values are the generator's, agreeing with the committed editor read (docs/inventory/small-families-reads/
# instances); the import writes each instance from its row and reads every value back. Never edited by hand.
schema = 1
id = "material/japan/treehouse/surface-rope-instances"
kind = "material-instance"
authority = "generated"
owner = "shared/japan/treehouse/surface-rope-instances"
license = "owner-published (docs/DECISIONS.md D05 group 1)"
provenance = "donor build of games/yorimichi at the V2 source baseline (docs/DECISIONS.md D01, D02); pinned by sha256"
input_dependencies = ["adopted/japan/treehouse/generator", "texture/japan/treehouse-rope"]

[recipe]
importer = "material-instance"
version = 2

[recipe.settings]

[[recipe.settings.instances]]
package = "/Game/Japan/Treehouse/Materials/MI_TH_rope"
parent = "/Game/Japan/Treehouse/Materials/M_TreeHouse"
textures = {Tex = "/Game/Japan/Treehouse/Textures/T_TH_rope"}
