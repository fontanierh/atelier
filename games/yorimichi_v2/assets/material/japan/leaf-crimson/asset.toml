# Prepared from the editor read of the saved parent (docs/inventory/exceptions.md, "Recipe for the two used leaves"):
# MI_LeafCrimson is an instance of M_Foliage whose Tex is the leaf-atlases texture T_leaf_crimson. No donor builder made it.
# Its one input is that texture's owner, so it pins no file of its own. The importer (tools/import/run.py) writes it
# in place; nothing here is imported until someone runs that import.
schema = 1
id = "material/japan/leaf-crimson"
kind = "material-instance"
authority = "generated"
owner = "shared/japan/materials/leaf-crimson"
provenance = "recipe recorded from the saved parent M_Foliage and the texture owned by adopted/japan/textures/leaf-atlases; no donor builder"
license = "owner-published (docs/DECISIONS.md D05 group 1)"
input_dependencies = ["master/japan/surfaces/foliage", "adopted/japan/textures/leaf-atlases"]

[recipe]
importer = "material-instance"
version = 2

[recipe.settings]
parent = "/Game/Japan/Materials/M_Foliage"
textures = { Tex = "/Game/Japan/Textures/T_leaf_crimson" }
scalars = {}
vectors = {}

[[outputs]]
package = "/Game/Japan/Materials/MI_LeafCrimson"
