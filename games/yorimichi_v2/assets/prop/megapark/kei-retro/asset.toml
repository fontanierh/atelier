# Its source is the donor generator's own export (games/yorimichi/assets/vehicles/kei/build.py, built by the donor step
# world.kei: build/yorimichi/kei/assets/SM_Kei_Retro.fbx, 804 triangles, 1 UCX box(es)), committed here, so the car
# is edited and reimported from V2 alone (tools/import/run.py). The settings are those of the donor's import
# (import_kei.py): M_Village on its one slot, the FBX's own box collision. ASuperUltraMegaPark parks it from park.json.
