[project]
name = "atelier"
version = "0.1.0"
description = "Game platform around Unreal Engine and Blender: tools, conventions and engine plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "httpx>=0.27",
  "fonttools>=4.66",
  "websockets>=15.0",
  "markdown-it-py>=4,<5",
  "cryptography>=43",
]

[project.scripts]
atelier = "atelier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform/studio/atelier"]

[tool.uv]
dev-dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["platform/studio/tests", "games"]
python_files = ["test_*.py"]
