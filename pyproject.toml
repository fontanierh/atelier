[project]
name = "atelier"
version = "0.1.0"
description = "Game platform around Unreal Engine and Blender: tools, conventions and engine plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "httpx>=0.27",
  "fonttools>=4.66",
  "websockets>=15.0",
  "markdown-it-py>=4,<5",
  "cryptography>=43",
  "manifold3d==3.5.4",
  "requests>=2.32",
]

[project.scripts]
atelier = "atelier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["platform/studio"]

[tool.hatch.build.targets.wheel]
only-include = ["platform/studio/atelier", "platform/harness/harness"]

[tool.hatch.build.targets.wheel.sources]
"platform/studio" = ""
"platform/harness" = "atelier"

[tool.uv]
dev-dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["platform/studio/tests", "platform/harness/tests", "games"]
python_files = ["test_*.py"]
